<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大盘资金看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', -apple-system, sans-serif;
            background: #f0f2f5;
            padding: 16px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 4px;
            color: #1a1a2e;
        }
        .update-time {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
        }
        .board-container {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .board {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .board-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .board-title.red {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .board-title.green {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .sub-title {
            text-align: center;
            font-size: 13px;
            color: #666;
            padding: 6px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .sub-title.green-bg {
            background: linear-gradient(90deg, #d4edda, #c3e6cb);
            color: #155724;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #f8f9fa;
            padding: 8px 4px;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        td {
            padding: 7px 4px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        tbody tr:hover {
            background: #f8f9ff;
        }
        .positive { color: #e74c3c; font-weight: bold; }
        .negative { color: #27ae60; font-weight: bold; }
        .neutral { color: #888; }
        .table-wrap {
            max-height: 520px;
            overflow-y: auto;
        }
        .table-wrap::-webkit-scrollbar { width: 5px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        
        @media (max-width: 1024px) {
            .board-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>📊 大盘资金看板</h1>
    <div class="update-time" id="updateTime">加载中...</div>

    <div class="board-container">
        <!-- 两市成交额 -->
        <div class="board">
            <div class="board-title">两市成交额</div>
            <div class="sub-title green-bg">单位：亿元</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>沪市成交额</th>
                            <th>深市成交额</th>
                            <th>合计</th>
                            <th>相比上日</th>
                        </tr>
                    </thead>
                    <tbody id="turnoverBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 两市融资余额 -->
        <div class="board">
            <div class="board-title red">两市融资余额</div>
            <div class="sub-title green-bg">单位：亿元</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>融资余额</th>
                            <th>相比上日</th>
                        </tr>
                    </thead>
                    <tbody id="marginBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 北向资金成交额 -->
        <div class="board">
            <div class="board-title green">北向资金成交额</div>
            <div class="sub-title green-bg">单位：亿元</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>沪股通</th>
                            <th>深股通</th>
                            <th>合计</th>
                            <th>相比上日</th>
                        </tr>
                    </thead>
                    <tbody id="northboundBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function formatCompare(val) {
            if (val === null || val === undefined || isNaN(val)) return '<span class="neutral">-</span>';
            const cls = val > 0 ? 'positive' : (val < 0 ? 'negative' : 'neutral');
            const sign = val > 0 ? '+' : '';
            return `<span class="${cls}">${sign}${val}</span>`;
        }

        function formatNumber(val) {
            if (val === null || val === undefined || isNaN(val)) return '-';
            return val.toFixed(2);
        }

        function renderTable(data) {
            document.getElementById('updateTime').textContent = `数据更新时间：${data.update_time}`;

            // 两市成交额
            const tb1 = document.getElementById('turnoverBody');
            tb1.innerHTML = data.turnover.map(r => `
                <tr>
                    <td>${r.date}</td>
                    <td>${formatNumber(r.sh_amount)}</td>
                    <td>${formatNumber(r.sz_amount)}</td>
                    <td><strong>${formatNumber(r.total)}</strong></td>
                    <td>${formatCompare(r.compare)}</td>
                </tr>
            `).join('');

            // 融资余额
            const tb2 = document.getElementById('marginBody');
            tb2.innerHTML = data.margin.map(r => `
                <tr>
                    <td>${r.date}</td>
                    <td><strong>${formatNumber(r.total)}</strong></td>
                    <td>${formatCompare(r.compare)}</td>
                </tr>
            `).join('');

            // 北向资金
            const tb3 = document.getElementById('northboundBody');
            tb3.innerHTML = data.northbound.map(r => `
                <tr>
                    <td>${r.date}</td>
                    <td>${formatNumber(r.hgt)}</td>
                    <td>${formatNumber(r.sgt)}</td>
                    <td><strong>${formatNumber(r.total)}</strong></td>
                    <td>${formatCompare(r.compare)}</td>
                </tr>
            `).join('');
        }

        // 加载数据（加时间戳防缓存）
        fetch('data/market_data.json?t=' + Date.now())
            .then(res => res.json())
            .then(renderTable)
            .catch(err => {
                document.getElementById('updateTime').textContent = '数据加载失败，请稍后刷新';
                console.error(err);
            });
    </script>
</body>
</html>
