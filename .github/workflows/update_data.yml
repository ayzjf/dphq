name: Update Northbound Data

on:
  schedule:
    # 每天 UTC 22:00 (即北京时间早上 6:00) 运行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许你手动点击按钮运行测试

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: 运行北向资金抓取脚本
        run: |
          python scripts/fetch_north.py

      - name: 提交并推送更新后的数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/north_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新北向资金数据 [skip ci]"
          git push
